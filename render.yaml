services:
  - type: web
    name: ai-sentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISABLE_DETECTION
        value: "true"
      - key: JWT_SECRET
        generateValue: true
